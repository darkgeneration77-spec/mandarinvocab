<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>儿童趣味识字｜Level 1–14</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#fff8ef,#eef8ff);color:#263241}.home{min-height:100vh;padding:30px 16px;text-align:center}.home h1{font-size:clamp(32px,7vw,58px);margin:0 0 10px}.home p{color:#66717e}.levels{width:min(900px,96%);margin:28px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.level{border:0;border-radius:18px;padding:22px 12px;background:#fff;box-shadow:0 8px 24px #33445518;font-size:22px;font-weight:900;cursor:pointer}.level small{display:block;margin-top:8px;font-size:14px;color:#68717d}.stage{display:none;min-height:100vh;background:#fff}.bar{position:sticky;top:0;z-index:9999;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;background:#ffffffee;border-bottom:1px solid #dfe4ea}.bar button,.bar select{border:0;border-radius:11px;padding:10px 14px;font-weight:800}.bar button{cursor:pointer}.back{background:#ff765f;color:#fff}.sound{background:#ffe69a}.bar select{background:#edf3ff}.frame{width:100%;height:calc(100vh - 62px);border:0;display:block}.progressBox{width:min(900px,96%);margin:0 auto 22px;background:#fff;border-radius:18px;padding:14px;box-shadow:0 8px 24px #33445518}.progressTop{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px}.track{height:12px;background:#e8edf2;border-radius:99px;overflow:hidden}.fill{height:100%;background:#62b77a;width:0}.levelProgress{display:block;margin-top:7px;font-size:13px;color:#6b7580}.quizFloat{position:fixed;right:18px;bottom:18px;z-index:99999;border:0;border-radius:18px;padding:14px 18px;background:#6941c6;color:#fff;font-weight:900;box-shadow:0 8px 24px #0003;cursor:pointer}.quizOverlay{position:fixed;inset:0;z-index:100000;background:#0008;display:grid;place-items:center;padding:18px}.quizPanel{width:min(560px,96vw);background:#fff;border-radius:24px;padding:24px;text-align:center}.quizChar{font-size:76px;font-weight:900;margin:10px}.quizChoices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quizChoices button{font-size:30px;padding:18px;border:1px solid #dfe4ea;background:#f7f9fc;border-radius:16px;font-weight:900}.quizMeta{color:#68717d;font-weight:700}.wrongBox{margin-top:12px;font-weight:800;color:#b44444}
</style>
</head>
<body>
<section id="home" class="home">
<h1>儿童趣味识字</h1>
<p>Level 1–14 · 两个阶段 · 共420个不重复生字</p>
<div class="progressBox"><div class="progressTop"><span>学习进度</span><span id="totalProgress">0 / 420</span></div><div class="track"><div class="fill" id="totalFill"></div></div><div id="wrongSummary" class="wrongBox"></div></div><div class="levels">
<button class="level" onclick="openLevel(1)">Level 1<small>基础生字</small><span class="levelProgress" id="lp1">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(2)">Level 2<small>家庭与动作</small><span class="levelProgress" id="lp2">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(3)">Level 3<small>用品与颜色</small><span class="levelProgress" id="lp3">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(4)">Level 4<small>自然与环境</small><span class="levelProgress" id="lp4">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(5)">Level 5<small>身体与生活</small><span class="levelProgress" id="lp5">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(6)">Level 6<small>动物与食物</small><span class="levelProgress" id="lp6">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(7)">Level 7<small>方向与状态</small><span class="levelProgress" id="lp7">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(8)">Level 8<small>学校、人际与语言</small><span class="levelProgress" id="lp8">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(9)">Level 9<small>生活动作与购物</small><span class="levelProgress" id="lp9">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(10)">Level 10<small>饮食与厨房</small><span class="levelProgress" id="lp10">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(11)">Level 11<small>时间与顺序</small><span class="levelProgress" id="lp11">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(12)">Level 12<small>地点与交通</small><span class="levelProgress" id="lp12">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(13)">Level 13<small>感受、情绪与状态</small><span class="levelProgress" id="lp13">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(14)">Level 14<small>高频阅读基础字</small><span class="levelProgress" id="lp14">已掌握 0/30</span></button>
</div>
</section>
<section id="stage" class="stage">
<div class="bar">
<button class="back" onclick="goHome()">← 回到主页</button>
<select id="levelSelect" onchange="openLevel(Number(this.value))">
<option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option><option value="4">Level 4</option><option value="5">Level 5</option><option value="6">Level 6</option><option value="7">Level 7</option><option value="8">Level 8</option><option value="9">Level 9</option><option value="10">Level 10</option><option value="11">Level 11</option><option value="12">Level 12</option><option value="13">Level 13</option><option value="14">Level 14</option>
</select>
<button class="sound" onclick="mobileSpeak('一')">🔊 测试声音</button>
</div>
<iframe id="lessonFrame" class="frame" title="识字课程"></iframe>
</section>
<audio id="ttsAudio" preload="none"></audio>
<script>
const files={
1:'儿童趣味识字_Level1_第一阶段30字.html',2:'儿童趣味识字_Level2_第一阶段30字.html',3:'儿童趣味识字_Level3_第一阶段30字.html',4:'儿童趣味识字_Level4_第一阶段30字.html',5:'儿童趣味识字_Level5_第一阶段30字.html',6:'儿童趣味识字_Level6_第一阶段30字.html',7:'儿童趣味识字_Level7_第一阶段30字.html',8:'儿童趣味识字_Level8_第二阶段30字.html',9:'儿童趣味识字_Level9_第二阶段30字.html',10:'儿童趣味识字_Level10_第二阶段30字.html',11:'儿童趣味识字_Level11_第二阶段30字.html',12:'儿童趣味识字_Level12_第二阶段30字.html',13:'儿童趣味识字_Level13_第二阶段30字.html',14:'儿童趣味识字_Level14_第二阶段30字.html'};
let currentLevel=1;
function openLevel(n){currentLevel=n;document.getElementById('home').style.display='none';document.getElementById('stage').style.display='block';document.getElementById('levelSelect').value=String(n);const f=document.getElementById('lessonFrame');f.src=files[n];window.scrollTo(0,0)}
function goHome(){const f=document.getElementById('lessonFrame');f.src='about:blank';document.getElementById('stage').style.display='none';document.getElementById('home').style.display='block';window.scrollTo(0,0)}
function browserSpeak(text){if(!('speechSynthesis' in window))return false;try{speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.72;u.pitch=1;u.volume=1;const vs=speechSynthesis.getVoices();const v=vs.find(x=>/^zh-CN$/i.test(x.lang))||vs.find(x=>/^zh/i.test(x.lang))||vs.find(x=>/Chinese|Mandarin|中文|普通话/i.test(x.name));if(v)u.voice=v;speechSynthesis.speak(u);return true}catch(e){return false}}
function mobileSpeak(text){const a=document.getElementById('ttsAudio');a.pause();a.currentTime=0;a.volume=1;a.muted=false;a.src='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q='+encodeURIComponent(text);const p=a.play();if(p&&p.catch){p.catch(()=>{if(!browserSpeak(text))alert('请用Chrome打开，并在手机设置中启用中文普通话文字转语音。')})}}
const frame=document.getElementById('lessonFrame');frame.addEventListener('load',()=>{try{const w=frame.contentWindow;w.speak=mobileSpeak;w.speakText=mobileSpeak;const doc=frame.contentDocument;enhanceLesson(doc,currentLevel);doc.querySelectorAll('button').forEach(btn=>{const oc=btn.getAttribute('onclick')||'';if(oc.includes("speak('")||oc.includes('speakText(')){btn.addEventListener('touchend',e=>{e.preventDefault();const m=oc.match(/(?:speak|speakText)\('([^']+)'\)/);if(m)mobileSpeak(m[1])},{passive:false})}})}catch(e){console.warn(e)}});
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}

function getStats(){try{return JSON.parse(localStorage.getItem('mandarinVocabStats')||'{"mastered":{},"wrong":{}}')}catch(e){return {mastered:{},wrong:{}}}}
function saveStats(s){localStorage.setItem('mandarinVocabStats',JSON.stringify(s));refreshHome()}
function refreshHome(){const s=getStats();let total=0,wrong=[];for(let n=1;n<=14;n++){let k=Object.keys(s.mastered[n]||{}).length;total+=k;let el=document.getElementById('lp'+n);if(el)el.textContent='已掌握 '+k+'/30'}document.getElementById('totalProgress').textContent=total+' / 420';document.getElementById('totalFill').style.width=(total/420*100)+'%';Object.entries(s.wrong||{}).forEach(([ch,v])=>{if(v>0)wrong.push([ch,v])});wrong.sort((a,b)=>b[1]-a[1]);document.getElementById('wrongSummary').textContent=wrong.length?'重点复习：'+wrong.slice(0,8).map(x=>x[0]).join('、'):'完成小测后，这里会自动显示需要复习的字。'}
function enhanceLesson(doc,n){if(!doc||doc.getElementById('levelQuizBtn'))return;let cards=[...doc.querySelectorAll('.card')];if(!cards.length)return;let items=cards.map(x=>({c:(x.querySelector('.han')||{}).textContent||'',py:(x.querySelector('.py')||{}).textContent||'',word:(x.querySelector('.word')||{}).textContent||''}));let st=doc.createElement('style');st.textContent='.quizFloat{position:fixed;right:18px;bottom:18px;z-index:99999;border:0;border-radius:18px;padding:14px 18px;background:#6941c6;color:white;font-weight:900;box-shadow:0 8px 24px #0003}.quizOverlay{position:fixed;inset:0;z-index:100000;background:#0008;display:grid;place-items:center;padding:18px}.quizPanel{width:min(560px,96vw);background:white;border-radius:24px;padding:24px;text-align:center}.quizChar{font-size:76px;font-weight:900}.quizChoices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quizChoices button{font-size:24px;padding:16px;border:1px solid #ddd;background:#f7f9fc;border-radius:16px;font-weight:800}.quizMeta{color:#68717d;font-weight:700}';doc.head.appendChild(st);let b=doc.createElement('button');b.id='levelQuizBtn';b.className='quizFloat';b.textContent='★ Level '+n+' 小测';doc.body.appendChild(b);b.onclick=()=>startQuiz(doc,n,items)}
function startQuiz(doc,n,items){let pool=[...items].sort(()=>Math.random()-.5).slice(0,10),q=0,score=0;let ov=doc.createElement('div');ov.className='quizOverlay';doc.body.appendChild(ov);function next(){if(q>=pool.length){ov.innerHTML='<div class="quizPanel"><h2>完成 Level '+n+' 小测</h2><div class="quizChar">'+score+'/10</div><p>'+(score>=8?'掌握得不错，可以继续复习错字。':'建议再复习这一关的生字。')+'</p><button id="closeQ">完成</button></div>';ov.querySelector('#closeQ').onclick=()=>ov.remove();return}let target=pool[q],others=items.filter(x=>x.c!==target.c).sort(()=>Math.random()-.5).slice(0,3),choices=[target,...others].sort(()=>Math.random()-.5);ov.innerHTML='<div class="quizPanel"><div class="quizMeta">第 '+(q+1)+' / '+pool.length+' 题 · 看词语选生字</div><h3>'+target.word+'</h3><div class="quizChoices">'+choices.map(x=>'<button data-c="'+x.c+'">'+x.c+'</button>').join('')+'</div></div>';ov.querySelectorAll('[data-c]').forEach(btn=>btn.onclick=()=>{let s=getStats(),ok=btn.dataset.c===target.c;s.mastered[n]=s.mastered[n]||{};if(ok){score++;s.mastered[n][target.c]=true;if(s.wrong[target.c])s.wrong[target.c]=Math.max(0,s.wrong[target.c]-1)}else{s.wrong[target.c]=(s.wrong[target.c]||0)+1}saveStats(s);q++;next()})}next()}
refreshHome();
</script>
</body>
</html>
