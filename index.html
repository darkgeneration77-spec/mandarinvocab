<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>儿童趣味识字｜Level 1–14</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei",Arial,sans-serif;color:#40514b}body{background:#dff4ff}
.home{min-height:100vh;padding:18px 14px 95px;text-align:center;position:relative;overflow:hidden;background:linear-gradient(#dff6ff 0 30%,#eafbd7 30% 100%)}
.home:before{content:"";position:absolute;left:-8%;right:-8%;top:24%;height:190px;background:#a9df7a;border-radius:50% 50% 0 0/55% 55% 0 0;opacity:.8}
.home>*{position:relative;z-index:1}
.top{width:min(980px,96%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{text-align:left}.brand h1{font-size:clamp(28px,6vw,48px);margin:0;color:#467a42;text-shadow:0 3px #fff}.brand p{margin:5px 0;color:#65866b;font-weight:800}
.badge{background:#fff8cf;border:3px solid #f3d66c;border-radius:20px;padding:10px 14px;font-weight:900;box-shadow:0 5px 0 #dfc258}
.progressBox{width:min(900px,96%);margin:18px auto 12px;background:#ffffffde;border:3px solid #fff;border-radius:24px;padding:14px 18px;box-shadow:0 7px 0 #b7dca4,0 12px 25px #56775a20}
.progressTop{display:flex;justify-content:space-between;font-weight:900;margin-bottom:8px}.track{height:15px;background:#e6efd9;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ffd65a,#7dd56f);width:0;border-radius:99px}.wrongBox{margin-top:9px;font-weight:800;color:#9c6756}
.world{width:min(930px,96%);margin:18px auto 0;padding:24px 12px 45px;border-radius:38px;background:linear-gradient(180deg,#f7f0cf,#dff1bb);box-shadow:inset 0 0 0 4px #ffffffaa}
.worldTitle{font-size:22px;font-weight:1000;color:#6a7c45;margin-bottom:18px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:20px;align-items:center}
.level{position:relative;border:0;border-radius:32px;padding:20px 9px 15px;background:linear-gradient(#75dff1,#50bdd6);box-shadow:0 8px 0 #319ab4,0 13px 18px #496a6526;font-size:21px;font-weight:1000;color:white;cursor:pointer;transition:.15s;min-height:108px;text-shadow:0 2px #33869a}
.level:nth-child(3n+2){background:linear-gradient(#ffc873,#f49d52);box-shadow:0 8px 0 #d87e37,0 13px 18px #496a6526;text-shadow:0 2px #c87937}
.level:nth-child(3n){background:linear-gradient(#a9df75,#72bd58);box-shadow:0 8px 0 #4c9d43,0 13px 18px #496a6526;text-shadow:0 2px #4d9944}
.level:hover{transform:translateY(-3px)}.level:active{transform:translateY(5px);box-shadow:0 3px 0 #468c73}
.level:before{content:"★";display:block;margin:auto auto 6px;width:34px;height:34px;line-height:34px;border-radius:50%;background:#fff7be;color:#f4b63e;text-shadow:none;font-size:22px}
.level small{display:block;margin-top:5px;font-size:13px;color:#fff;text-shadow:none}.levelProgress{display:block;margin-top:6px;font-size:12px;color:#eaffff;text-shadow:none}
.bottomDock{position:fixed;z-index:8;bottom:12px;left:50%;transform:translateX(-50%);width:min(520px,92%);display:flex;justify-content:space-around;background:#ffffffed;border:3px solid #fff;border-radius:28px;padding:8px;box-shadow:0 7px 18px #496a6540}
.dockItem{border:0;background:transparent;font-weight:900;color:#66806a;padding:7px 13px;border-radius:17px}.dockItem.active{background:#e4f5cc;color:#4d8b4d}
.stage{display:none;min-height:100vh;background:#fff}.bar{position:sticky;top:0;z-index:9999;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;background:#effbe8;border-bottom:3px solid #cce6b7}.bar button,.bar select{border:0;border-radius:15px;padding:11px 15px;font-weight:900}.bar button{cursor:pointer}.back{background:#ff8b68;color:#fff}.sound{background:#ffe27b}.bar select{background:#fff}.frame{width:100%;height:calc(100vh - 64px);border:0;display:block}
@media(max-width:600px){.top{align-items:flex-start}.badge{font-size:12px}.levels{grid-template-columns:repeat(2,1fr);gap:16px}.world{padding:18px 9px 38px}.level{min-height:104px}}
</style>
</head>
<body>
<section id="home" class="home">
<div class="top"><div class="brand"><h1>汉字探险岛</h1><p>认识汉字，一关一关向前走</p></div><div class="badge">🏆 <span id="totalProgress">0 / 420</span></div></div>
<div class="progressBox"><div class="progressTop"><span>今日识字进度</span><span>⭐ 继续加油</span></div><div class="track"><div class="fill" id="totalFill"></div></div><div id="wrongSummary" class="wrongBox"></div></div>
<div class="world"><div class="worldTitle">🌳 汉字成长路线 · Level 1–14</div><div class="levels">
<button class="level" onclick="openLevel(1)">Level 1<small>基础生字</small><span class="levelProgress" id="lp1">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(2)">Level 2<small>家庭与动作</small><span class="levelProgress" id="lp2">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(3)">Level 3<small>用品与颜色</small><span class="levelProgress" id="lp3">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(4)">Level 4<small>自然与环境</small><span class="levelProgress" id="lp4">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(5)">Level 5<small>身体与生活</small><span class="levelProgress" id="lp5">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(6)">Level 6<small>动物与食物</small><span class="levelProgress" id="lp6">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(7)">Level 7<small>方向与状态</small><span class="levelProgress" id="lp7">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(8)">Level 8<small>学校、人际与语言</small><span class="levelProgress" id="lp8">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(9)">Level 9<small>生活动作与购物</small><span class="levelProgress" id="lp9">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(10)">Level 10<small>饮食与厨房</small><span class="levelProgress" id="lp10">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(11)">Level 11<small>时间与顺序</small><span class="levelProgress" id="lp11">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(12)">Level 12<small>地点与交通</small><span class="levelProgress" id="lp12">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(13)">Level 13<small>感受、情绪与状态</small><span class="levelProgress" id="lp13">已掌握 0/30</span></button>
<button class="level" onclick="openLevel(14)">Level 14<small>高频阅读基础字</small><span class="levelProgress" id="lp14">已掌握 0/30</span></button>
</div></div>
<div class="bottomDock"><button class="dockItem active">🏠 学习</button><button class="dockItem" onclick="alert('完成小测后，错字会自动加入重点复习。')">🧠 复习</button><button class="dockItem" onclick="alert('阅读模块将在下一阶段加入。')">📖 阅读</button></div>
</section>
<section id="stage" class="stage">
<div class="bar">
<button class="back" onclick="goHome()">← 回到主页</button>
<select id="levelSelect" onchange="openLevel(Number(this.value))">
<option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option><option value="4">Level 4</option><option value="5">Level 5</option><option value="6">Level 6</option><option value="7">Level 7</option><option value="8">Level 8</option><option value="9">Level 9</option><option value="10">Level 10</option><option value="11">Level 11</option><option value="12">Level 12</option><option value="13">Level 13</option><option value="14">Level 14</option>
</select>
<button class="sound" onclick="mobileSpeak('一')">🔊 测试声音</button>
</div>
<iframe id="lessonFrame" class="frame" title="识字课程"></iframe>
</section>
<audio id="ttsAudio" preload="none"></audio>
<script>
const files={
1:'儿童趣味识字_Level1_第一阶段30字.html',2:'儿童趣味识字_Level2_第一阶段30字.html',3:'儿童趣味识字_Level3_第一阶段30字.html',4:'儿童趣味识字_Level4_第一阶段30字.html',5:'儿童趣味识字_Level5_第一阶段30字.html',6:'儿童趣味识字_Level6_第一阶段30字.html',7:'儿童趣味识字_Level7_第一阶段30字.html',8:'儿童趣味识字_Level8_第二阶段30字.html',9:'儿童趣味识字_Level9_第二阶段30字.html',10:'儿童趣味识字_Level10_第二阶段30字.html',11:'儿童趣味识字_Level11_第二阶段30字.html',12:'儿童趣味识字_Level12_第二阶段30字.html',13:'儿童趣味识字_Level13_第二阶段30字.html',14:'儿童趣味识字_Level14_第二阶段30字.html'};
let currentLevel=1;
function openLevel(n){currentLevel=n;document.getElementById('home').style.display='none';document.getElementById('stage').style.display='block';document.getElementById('levelSelect').value=String(n);const f=document.getElementById('lessonFrame');f.src=files[n];window.scrollTo(0,0)}
function goHome(){const f=document.getElementById('lessonFrame');f.src='about:blank';document.getElementById('stage').style.display='none';document.getElementById('home').style.display='block';window.scrollTo(0,0)}
function browserSpeak(text){if(!('speechSynthesis' in window))return false;try{speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.72;u.pitch=1;u.volume=1;const vs=speechSynthesis.getVoices();const v=vs.find(x=>/^zh-CN$/i.test(x.lang))||vs.find(x=>/^zh/i.test(x.lang))||vs.find(x=>/Chinese|Mandarin|中文|普通话/i.test(x.name));if(v)u.voice=v;speechSynthesis.speak(u);return true}catch(e){return false}}
function mobileSpeak(text){const a=document.getElementById('ttsAudio');a.pause();a.currentTime=0;a.volume=1;a.muted=false;a.src='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q='+encodeURIComponent(text);const p=a.play();if(p&&p.catch){p.catch(()=>{if(!browserSpeak(text))alert('请用Chrome打开，并在手机设置中启用中文普通话文字转语音。')})}}
const frame=document.getElementById('lessonFrame');frame.addEventListener('load',()=>{try{const w=frame.contentWindow;w.speak=mobileSpeak;w.speakText=mobileSpeak;const doc=frame.contentDocument;enhanceLesson(doc,currentLevel);doc.querySelectorAll('button').forEach(btn=>{const oc=btn.getAttribute('onclick')||'';if(oc.includes("speak('")||oc.includes('speakText(')){btn.addEventListener('touchend',e=>{e.preventDefault();const m=oc.match(/(?:speak|speakText)\('([^']+)'\)/);if(m)mobileSpeak(m[1])},{passive:false})}})}catch(e){console.warn(e)}});
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}

function getStats(){try{return JSON.parse(localStorage.getItem('mandarinVocabStats')||'{"mastered":{},"wrong":{}}')}catch(e){return {mastered:{},wrong:{}}}}
function saveStats(s){localStorage.setItem('mandarinVocabStats',JSON.stringify(s));refreshHome()}
function refreshHome(){const s=getStats();let total=0,wrong=[];for(let n=1;n<=14;n++){let k=Object.keys(s.mastered[n]||{}).length;total+=k;let el=document.getElementById('lp'+n);if(el)el.textContent='已掌握 '+k+'/30'}document.getElementById('totalProgress').textContent=total+' / 420';document.getElementById('totalFill').style.width=(total/420*100)+'%';Object.entries(s.wrong||{}).forEach(([ch,v])=>{if(v>0)wrong.push([ch,v])});wrong.sort((a,b)=>b[1]-a[1]);document.getElementById('wrongSummary').textContent=wrong.length?'重点复习：'+wrong.slice(0,8).map(x=>x[0]).join('、'):'完成小测后，这里会自动显示需要复习的字。'}
function enhanceLesson(doc,n){
if(!doc||doc.getElementById('levelQuizBtn'))return;
let cards=[...doc.querySelectorAll('.card')];if(!cards.length)return;
let items=cards.map(x=>({c:(x.querySelector('.han')||{}).textContent||'',py:(x.querySelector('.py')||{}).textContent||'',word:(x.querySelector('.word')||{}).textContent||''}));
let st=doc.createElement('style');st.textContent=`
body{background:linear-gradient(180deg,#dff6ff 0,#effbdc 260px,#fffaf0 100%)!important;color:#40514b!important}
header{padding:24px 14px 16px!important}header h1{color:#4d844b!important;text-shadow:0 3px #fff;font-size:clamp(28px,6vw,46px)!important}header p{font-weight:800!important;color:#68806a!important}
nav{top:0!important;background:#ffffffed!important;border:0!important;box-shadow:0 5px 18px #60706022!important;padding:10px!important}nav button{border-radius:18px!important;padding:11px 16px!important;box-shadow:0 4px 0 #c9d8c4!important}
.note{background:#fff9cf!important;border:3px solid #f2dc7c!important;border-radius:22px!important;box-shadow:0 5px 0 #dfcb72!important}
main{display:block!important;width:min(760px,96%)!important;padding-bottom:110px!important}
.card{display:none!important;border:0!important;border-radius:34px!important;padding:22px!important;box-shadow:0 10px 0 #d8e8d0,0 18px 35px #55706022!important;margin:18px auto!important;max-width:620px!important;background:#fff!important}
.card.lesson-active{display:block!important}.card.active{outline:none!important}
.card .num{font-size:15px!important;background:#e9f7d9;padding:7px 11px;border-radius:20px;color:#59824f!important;font-weight:900}
.row{justify-content:center!important;align-items:center!important}.han{width:128px!important;height:128px!important;font-size:88px!important;border:0!important;border-radius:32px!important;background:#fff4d8!important;box-shadow:inset 0 0 0 4px #ffe29a}
.py{font-size:34px!important;color:#4a92d8!important}.word{font-size:25px!important;margin-top:8px!important}.count{font-weight:800!important}
.gridbox{width:240px!important;height:240px!important;border:3px solid #d9e4d5!important;border-radius:24px!important;overflow:hidden!important;background:#fff!important}
.btns{grid-template-columns:repeat(3,1fr)!important;gap:10px!important}.btns button{border-radius:18px!important;padding:14px 5px!important;font-size:16px!important;box-shadow:0 5px 0 #cbd8c7!important}
.lessonSteps{width:min(620px,94%);margin:12px auto 0;display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.lessonSteps button{border:0;border-radius:16px;padding:9px 3px;background:#fff;color:#6a8069;font-weight:900;box-shadow:0 4px 0 #d4e5ca}.lessonSteps button.on{background:#78cf6b;color:#fff;box-shadow:0 4px 0 #4da54a}
.lessonBottom{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9998;width:min(610px,94%);display:flex;gap:10px;background:#ffffffef;padding:9px;border-radius:25px;box-shadow:0 7px 25px #44554435}.lessonBottom button{flex:1;border:0;border-radius:18px;padding:13px 6px;font-weight:900;font-size:16px}.prevB{background:#e8f0f4}.nextB{background:#74cf68;color:#fff}.testB{background:#ffd866}
.quizFloat{display:none}.quizOverlay{position:fixed;inset:0;z-index:100000;background:#0008;display:grid;place-items:center;padding:18px}.quizPanel{width:min(560px,96vw);background:white;border-radius:28px;padding:24px;text-align:center}.quizChar{font-size:76px;font-weight:900}.quizChoices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quizChoices button{font-size:24px;padding:16px;border:1px solid #ddd;background:#f7f9fc;border-radius:18px;font-weight:900}.quizMeta{color:#68717d;font-weight:700}
@media(max-width:560px){.row{gap:12px!important}.han{width:105px!important;height:105px!important;font-size:72px!important}.gridbox{width:220px!important;height:220px!important}.lessonSteps{grid-template-columns:repeat(6,1fr)}}
`;doc.head.appendChild(st);
let idx=0;
let steps=doc.createElement('div');steps.className='lessonSteps';steps.innerHTML=Array.from({length:6},(_,i)=>'<button data-g="'+i+'">第'+(i+1)+'关</button>').join('');let note=doc.querySelector('.note');(note||doc.querySelector('header')).insertAdjacentElement('afterend',steps);
let bottom=doc.createElement('div');bottom.className='lessonBottom';bottom.innerHTML='<button class="prevB">← 上一个</button><button class="testB">★ 本关小测</button><button class="nextB">下一个 →</button>';doc.body.appendChild(bottom);
function show(i){idx=Math.max(0,Math.min(cards.length-1,i));cards.forEach((x,j)=>x.classList.toggle('lesson-active',j===idx));steps.querySelectorAll('button').forEach((x,j)=>x.classList.toggle('on',j===Math.floor(idx/5)));cards[idx].scrollIntoView({behavior:'smooth',block:'center'})}
steps.querySelectorAll('button').forEach(b=>b.onclick=()=>show(Number(b.dataset.g)*5));bottom.querySelector('.prevB').onclick=()=>show(idx-1);bottom.querySelector('.nextB').onclick=()=>show(idx+1);bottom.querySelector('.testB').onclick=()=>{let g=Math.floor(idx/5),slice=items.slice(g*5,g*5+5);startQuiz(doc,n,slice)};
show(0);
}function startQuiz(doc,n,items){let pool=[...items].sort(()=>Math.random()-.5).slice(0,10),q=0,score=0;let ov=doc.createElement('div');ov.className='quizOverlay';doc.body.appendChild(ov);function next(){if(q>=pool.length){ov.innerHTML='<div class="quizPanel"><h2>完成 Level '+n+' 小测</h2><div class="quizChar">'+score+'/10</div><p>'+(score>=8?'掌握得不错，可以继续复习错字。':'建议再复习这一关的生字。')+'</p><button id="closeQ">完成</button></div>';ov.querySelector('#closeQ').onclick=()=>ov.remove();return}let target=pool[q],others=items.filter(x=>x.c!==target.c).sort(()=>Math.random()-.5).slice(0,3),choices=[target,...others].sort(()=>Math.random()-.5);ov.innerHTML='<div class="quizPanel"><div class="quizMeta">第 '+(q+1)+' / '+pool.length+' 题 · 看词语选生字</div><h3>'+target.word+'</h3><div class="quizChoices">'+choices.map(x=>'<button data-c="'+x.c+'">'+x.c+'</button>').join('')+'</div></div>';ov.querySelectorAll('[data-c]').forEach(btn=>btn.onclick=()=>{let s=getStats(),ok=btn.dataset.c===target.c;s.mastered[n]=s.mastered[n]||{};if(ok){score++;s.mastered[n][target.c]=true;if(s.wrong[target.c])s.wrong[target.c]=Math.max(0,s.wrong[target.c]-1)}else{s.wrong[target.c]=(s.wrong[target.c]||0)+1}saveStats(s);q++;next()})}next()}
refreshHome();
</script>
</body>
</html>
