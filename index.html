<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>儿童趣味识字｜Level 1–7</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#fff8ef,#eef8ff);color:#263241}.home{min-height:100vh;padding:30px 16px;text-align:center}.home h1{font-size:clamp(32px,7vw,58px);margin:0 0 10px}.home p{color:#66717e}.levels{width:min(900px,96%);margin:28px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.level{border:0;border-radius:18px;padding:22px 12px;background:#fff;box-shadow:0 8px 24px #33445518;font-size:22px;font-weight:900;cursor:pointer}.level small{display:block;margin-top:8px;font-size:14px;color:#68717d}.stage{display:none;min-height:100vh;background:#fff}.bar{position:sticky;top:0;z-index:9999;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;background:#ffffffee;border-bottom:1px solid #dfe4ea}.bar button,.bar select{border:0;border-radius:11px;padding:10px 14px;font-weight:800}.bar button{cursor:pointer}.back{background:#ff765f;color:#fff}.sound{background:#ffe69a}.bar select{background:#edf3ff}.frame{width:100%;height:calc(100vh - 62px);border:0;display:block}
</style>
</head>
<body>
<section id="home" class="home">
<h1>儿童趣味识字</h1>
<p>第一阶段 · Level 1–7 · 共210个生字</p>
<div class="levels">
<button class="level" onclick="openLevel(1)">Level 1<small>基础生字</small></button>
<button class="level" onclick="openLevel(2)">Level 2<small>家庭与动作</small></button>
<button class="level" onclick="openLevel(3)">Level 3<small>用品与颜色</small></button>
<button class="level" onclick="openLevel(4)">Level 4<small>自然与环境</small></button>
<button class="level" onclick="openLevel(5)">Level 5<small>身体与生活</small></button>
<button class="level" onclick="openLevel(6)">Level 6<small>动物与食物</small></button>
<button class="level" onclick="openLevel(7)">Level 7<small>方向与状态</small></button>
</div>
</section>
<section id="stage" class="stage">
<div class="bar">
<button class="back" onclick="goHome()">← 回到主页</button>
<select id="levelSelect" onchange="openLevel(Number(this.value))">
<option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option><option value="4">Level 4</option><option value="5">Level 5</option><option value="6">Level 6</option><option value="7">Level 7</option>
</select>
<button class="sound" onclick="mobileSpeak('一')">🔊 测试声音</button>
</div>
<iframe id="lessonFrame" class="frame" title="识字课程"></iframe>
</section>
<audio id="ttsAudio" preload="none"></audio>
<script>
const files={
1:'儿童趣味识字_Level1_第一阶段30字.html',2:'儿童趣味识字_Level2_第一阶段30字.html',3:'儿童趣味识字_Level3_第一阶段30字.html',4:'儿童趣味识字_Level4_第一阶段30字.html',5:'儿童趣味识字_Level5_第一阶段30字.html',6:'儿童趣味识字_Level6_第一阶段30字.html',7:'儿童趣味识字_Level7_第一阶段30字.html'};
let currentLevel=1;
function openLevel(n){currentLevel=n;document.getElementById('home').style.display='none';document.getElementById('stage').style.display='block';document.getElementById('levelSelect').value=String(n);const f=document.getElementById('lessonFrame');f.src=files[n];window.scrollTo(0,0)}
function goHome(){const f=document.getElementById('lessonFrame');f.src='about:blank';document.getElementById('stage').style.display='none';document.getElementById('home').style.display='block';window.scrollTo(0,0)}
function browserSpeak(text){if(!('speechSynthesis' in window))return false;try{speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.72;u.pitch=1;u.volume=1;const vs=speechSynthesis.getVoices();const v=vs.find(x=>/^zh-CN$/i.test(x.lang))||vs.find(x=>/^zh/i.test(x.lang))||vs.find(x=>/Chinese|Mandarin|中文|普通话/i.test(x.name));if(v)u.voice=v;speechSynthesis.speak(u);return true}catch(e){return false}}
function mobileSpeak(text){const a=document.getElementById('ttsAudio');a.pause();a.currentTime=0;a.volume=1;a.muted=false;a.src='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q='+encodeURIComponent(text);const p=a.play();if(p&&p.catch){p.catch(()=>{if(!browserSpeak(text))alert('请用Chrome打开，并在手机设置中启用中文普通话文字转语音。')})}}
const frame=document.getElementById('lessonFrame');frame.addEventListener('load',()=>{try{const w=frame.contentWindow;w.speak=mobileSpeak;w.speakText=mobileSpeak;const doc=frame.contentDocument;doc.querySelectorAll('button').forEach(btn=>{const oc=btn.getAttribute('onclick')||'';if(oc.includes("speak('")||oc.includes('speakText(')){btn.addEventListener('touchend',e=>{e.preventDefault();const m=oc.match(/(?:speak|speakText)\('([^']+)'\)/);if(m)mobileSpeak(m[1])},{passive:false})}})}catch(e){console.warn(e)}});
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}
</script>
</body>
</html>
